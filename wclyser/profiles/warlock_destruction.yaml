# Destruction Warlock.
#
# Spells are named as they appear in the log. Editing these lists changes the
# analysis; no code changes with them. A name that matches nothing in the
# report is reported rather than ignored.

class: Warlock
spec: Destruction

havoc:
  # The spell that opens a window, and how long the window lasts. 20 seconds
  # assumes the Improved Havoc talent.
  ability: Havoc
  window_s: 20

  # How long before the window opens counts as the lead-in. A spell from the
  # bad list cast here was cleared out of the way, which is a good sign.
  lead_in_s: 5

  # Shard generation, used to extrapolate the level at the window opening back
  # from the first shard-spending cast inside it. Shards per cast.
  #
  # Two approximations are baked in and both under-count generation, so the
  # extrapolated entry level reads slightly high:
  #   - critical strikes generate extra shards and are ignored;
  #   - the Immolate or Wither tick is treated as a fixed cadence, and assumed
  #     to be running for the whole stretch being extrapolated across.
  generation:
    per_cast:
      Conflagrate: 0.5
      Soul Fire: 1.0
      Incinerate: 0.2
    passive:
      shards_per_tick: 0.1
      tick_s: 1.5
    # Havoc duplicates the cast onto a second target, so generation inside the
    # window counts twice.
    havoc_multiplier: 2

  # Best first. Rank 1 is the best use of a duplicated cast.
  good:
    - Soul Fire
    - Shadowburn
    - Chaos Bolt
    - Conflagrate
    - Incinerate

  # Worst first. These should not be cast inside a window.
  bad:
    - Summon Infernal
    - Malevolence
    - Wither

  # Everything else is recorded but not judged. Movement, defensives,
  # healthstones and utility land here.

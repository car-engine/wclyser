# A saved analysis run. Nothing here applies unless a command names this
# file with --config, so no run is quietly shaped by a file on disk.
#
# Credentials are NOT read from here. Put them in .env, or export
# WCL_CLIENT_ID and WCL_CLIENT_SECRET.

data_dir: data

subjects:
  # Fallback list, used when nothing more specific matches.
  default: []

  # Pin the analysed players for a particular report. Useful when you are not
  # in the raid yourself and are analysing for someone else.
  by_report:
    # dYGnBvDgfjcTNqKX: ["Nevaritius-Frostmourne-US"]

  # Pick up whoever in the report matches, so a night with two warlocks and a
  # night with three both work without editing anything.
  auto_select:
    class: Warlock
    spec: Demonology

# The pulls under study. Override per run with --encounter / --difficulty
# / --spec, or ignore the block entirely with --all.
focus:
  # Boss name substring, or the numeric encounter id.
  encounter: Entombed Sentinels
  # LFR, Normal, Heroic, Mythic, Mythic+, or the raw id.
  difficulty: Mythic
  # Keeps only the pulls where a subject played this specialisation, read from
  # that pull's own player details.
  spec: Destruction

# Which analysis modules this configuration runs. --module overrides it.
analysis:
  modules: [havoc]

# Where generated pages go. Defaults to ./reports, laid out as
#   reports/<raid_night>_<report_code>/<player>_<module>.html
# reports_dir: reports

# What reaches the database. With no list here the import takes exactly what
# the analysis modules above read, which for havoc is casts alone. With
# neither a list nor a module it imports everything, 47.5 MB a night against
# 1.55 MB.
#
# An analysis that needs a stream absent from here fails with the command to
# add it, rather than answering over missing rows.
# import:
#   streams: [casts, resources]

fetch:
  encounters_only: true
  event_limit: 10000
  include_resources: true
  # A pull counts as finished once the report has run on this far past its end.
  finality_margin_s: 30
  # Refuse to start a fetch with fewer points than this left in the hour.
  point_floor: 200

http:
  timeout_s: 60
  max_attempts: 6
  backoff_base_s: 2
  backoff_cap_s: 60

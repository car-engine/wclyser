[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcl-analyser"
version = "0.1.0"
description = "Personal Warcraft Logs raid performance analysis toolkit"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "PyYAML>=6.0",
]

[project.scripts]
wcla = "wcl_analyser.cli:main"

[tool.setuptools.packages.find]
include = ["wcl_analyser*"]
